; Kairos firmware for an ESP32-S3 (see docs/esp32-port.md).
;   pio run -e device -t upload    build and flash over USB (leaves NVS, so pairing and the schedule survive)
;   pio test -e native             run the host unit tests (no hardware)
; Pin the platform, core and library versions: the Ethernet and BLE APIs differ between Arduino-ESP32 2.x and 3.x.

[platformio]
default_envs = device

[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DFW_VERSION=\"1.0.0\"
build_src_filter = +<*>

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DVECTORS_PATH=\"../docs/test-vectors.json\"
build_src_filter = -<*>
