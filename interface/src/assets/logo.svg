<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="#0f172a"/>

  <!-- Camera body -->
  <rect x="30" y="72" width="140" height="96" rx="14" fill="#1e293b"/>

  <!-- Viewfinder bump -->
  <rect x="66" y="54" width="44" height="24" rx="8" fill="#1e293b"/>

  <!-- Lens outer ring -->
  <circle cx="100" cy="120" r="36" fill="#0f172a"/>

  <!-- Lens inner -->
  <circle cx="100" cy="120" r="26" fill="#1e293b"/>

  <!-- Clock hands -->
  <line x1="100" y1="120" x2="90" y2="109" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="100" y2="104" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="120" r="3" fill="#f8fafc"/>
</svg>
