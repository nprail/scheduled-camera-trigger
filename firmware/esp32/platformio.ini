; Kairos firmware for an ESP32-S3 or ESP32-C3 (see docs/esp32-port.md).
;   pio run -e device -t upload       ESP32-S3: build and flash over USB (leaves NVS, so pairing and the schedule survive)
;   pio run -e device-c3 -t upload    ESP32-C3: the same firmware with the C3 pins and a 4 MB partition table
;   pio run -e device-dev             the same, but it accepts unsigned updates over Bluetooth (developer builds only)
;   pio test -e native             run the host unit tests (no hardware)
; Pin the platform, core and library versions: the Ethernet and BLE APIs differ between Arduino-ESP32 2.x and 3.x.

[platformio]
default_envs = device

[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
build_src_filter = +<*>
; FW_VERSION comes from $KAIROS_VERSION, else `git describe`, else "dev"
extra_scripts =
  pre:version.py
  post:otadata.py

; The same firmware on an ESP32-C3 (one core, 4 MB flash). Only the pins (src/platform/board.h) and the partitions differ.
[env:device-c3]
extends = env:device
board = esp32-c3-devkitm-1
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB

; Developer builds: they accept unsigned firmware updates, so a local build can be sent over Bluetooth.
; They say so at every boot, and the release workflow never builds them.
[env:device-dev]
extends = env:device
build_flags =
  ${env:device.build_flags}
  -DKAIROS_ALLOW_UNSIGNED=1

[env:device-c3-dev]
extends = env:device-c3
build_flags =
  ${env:device-c3.build_flags}
  -DKAIROS_ALLOW_UNSIGNED=1

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DVECTORS_PATH=\"../../protocol/test-vectors.json\"
build_src_filter = -<*>
