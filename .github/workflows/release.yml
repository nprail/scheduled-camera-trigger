name: Release firmware

# Push a tag like v1.2.0 to build the ESP32 firmware and attach it to a GitHub Release.
# The tag (without the "v") becomes the firmware version the device reports.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.chip }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - chip: esp32s3
            env: device
            slot: 0x1F0000 # the largest image the device accepts (partitions.csv)
          - chip: esp32c3
            env: device-c3
            slot: 0x1D0000 # partitions_4mb.csv
    env:
      KAIROS_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini') }}

      - run: pip install platformio==6.1.19

      # never ship firmware that fails its own tests
      - name: Host tests
        working-directory: firmware/esp32
        run: pio test -e native

      - name: Build
        working-directory: firmware/esp32
        run: pio run -e ${{ matrix.env }}

      - name: Collect binaries
        run: |
          v="${GITHUB_REF_NAME#v}"
          out=dist
          mkdir -p "$out"
          b=firmware/esp32/.pio/build/${{ matrix.env }}
          # factory: bootloader, partitions and app in one image, flashed at 0x0 (erases pairing and schedule)
          cp "$b/firmware.factory.bin" "$out/kairos-${{ matrix.chip }}-$v-factory.bin"
          # app only: flashed at 0x20000 (keeps pairing and schedule); also what a phone sends over Bluetooth
          cp "$b/firmware.bin" "$out/kairos-${{ matrix.chip }}-$v-app.bin"
          # a release must fit the update slot, or no device could take it over Bluetooth
          size=$(stat -c%s "$out/kairos-${{ matrix.chip }}-$v-app.bin")
          if [ "$size" -gt $(( ${{ matrix.slot }} )) ]; then
            echo "app image is $size bytes, over the ${{ matrix.slot }} slot"
            exit 1
          fi
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.chip }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install cryptography

      # Every app image is signed (ECDSA P-256 over its SHA-256) with the release key, a repository secret. The
      # devices hold the public key (firmware/esp32/src/platform/signing_keys.h) and refuse anything else.
      # The factory image is never sent over Bluetooth, so it is not signed.
      - name: Sign the images and write the manifest
        env:
          KAIROS_SIGNING_KEY: ${{ secrets.KAIROS_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$KAIROS_SIGNING_KEY" ]; then
            echo "The KAIROS_SIGNING_KEY secret is not set: see docs/updating-firmware.md"
            exit 1
          fi
          tool=firmware/esp32/tools/signing.py
          python3 "$tool" --header firmware/esp32/src/platform/signing_keys.h sign dist/kairos-*-app.bin
          python3 "$tool" manifest dist "$TAG" \
            --min-from "$(cat firmware/esp32/MIN_FROM)" \
            --notes "https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Checksums
        working-directory: dist
        run: sha256sum *.bin > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          ESP32 firmware for Kairos. Pick the files for your chip (`esp32s3` or `esp32c3`).

          | File | Flash at | When to use it |
          | --- | --- | --- |
          | `*-factory.bin` | `0x0` | A new or blank board. **Erases the pairing key and the schedule.** |
          | `*-app.bin` | `0x20000` | Updating a board that is already paired. Keeps the pairing key and the schedule. |
          | `*-app.bin.sig` | | The signature of the matching `-app.bin`. The apps check it; a device refuses firmware that is not signed by Kairos. |
          | `manifest.json` | | What the apps read to find this release. |

          **In the Kairos apps:** open a device, then Firmware. The apps download the right file for the chip and send it over Bluetooth. Updates are always optional.

          With esptool: `esptool.py write_flash 0x0 kairos-esp32s3-<version>-factory.bin`.
          Verify downloads against `SHA256SUMS`.
          NOTES
          # a tag with a hyphen (v1.3.0-beta.1) is a pre-release: the apps only offer it from Advanced
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "Kairos firmware $TAG" \
            --notes-file notes.md \
            --verify-tag $flags
