name: Deploy site

# Builds the docs with docmd into site/docs, then publishes site/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "docmd/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; let a running deployment finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docmd/package-lock.json

      - name: Install docmd
        working-directory: docmd
        run: npm ci

      - name: Build the docs into site/docs
        working-directory: docmd
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
