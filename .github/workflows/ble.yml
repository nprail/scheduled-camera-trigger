name: BLE tests

on: [push, pull_request]

jobs:
  device:
    name: Device (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      # native modules (onoff, hci-socket) only build on the Pi
      - run: npm ci --ignore-scripts
      - run: npm test

  ios:
    name: iOS (Swift)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Test CameraTriggerKit
        working-directory: ios/CameraTriggerKit
        run: swift test
      - name: Build the app
        working-directory: ios
        run: |
          xcodebuild build \
            -project CameraTrigger.xcodeproj \
            -scheme CameraTrigger \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
