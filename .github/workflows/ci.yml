name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Legacy device (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firmware/legacy-pi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: firmware/legacy-pi/package-lock.json

      # the native modules (onoff, hci-socket) only build on the Pi
      - run: npm ci --ignore-scripts

      - run: npm test

  esp32:
    name: ESP32 (PlatformIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # the platform, toolchain and libraries are large: keep them between runs
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini') }}

      # the pioarduino platform in platformio.ini needs PlatformIO Core 6.1.19 or newer
      - run: pip install platformio==6.1.19

      - name: Host tests (protocol, config, scheduler, cameras)
        working-directory: firmware/esp32
        run: pio test -e native

      - name: Build the firmware (ESP32-S3)
        working-directory: firmware/esp32
        run: pio run -e device

      - name: Build the firmware (ESP32-C3)
        working-directory: firmware/esp32
        run: pio run -e device-c3

      # the developer builds accept unsigned updates: they must keep compiling, but are never released
      - name: Build the developer firmware (ESP32-S3)
        working-directory: firmware/esp32
        run: pio run -e device-dev

      - name: Signing tool tests
        run: |
          pip install cryptography
          python3 -m unittest discover -s firmware/esp32/tools

      # factory.bin is the whole flash image (flash at 0x0), firmware.bin is the app alone (flash at 0x20000)
      - name: Upload the firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            firmware/esp32/.pio/build/device/firmware.factory.bin
            firmware/esp32/.pio/build/device/firmware.bin
            firmware/esp32/.pio/build/device-c3/firmware.factory.bin
            firmware/esp32/.pio/build/device-c3/firmware.bin
          if-no-files-found: error

  ios:
    name: iOS (Swift)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # the project file format needs Xcode 16 or newer
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test KairosKit
        working-directory: apps/ios/KairosKit
        run: swift test

      - name: Build the app
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Kairos.xcodeproj \
            -scheme Kairos \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug

      # the release configuration must keep building. With the upload key (the repository's secrets, so not
      # on forks) the build is signed; without it, only an unsigned bundle is built, to check that it compiles
      - name: Check the signing secrets
        id: keys
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "signing=$([ -n "$KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build release bundle (unsigned)
        if: steps.keys.outputs.signing != 'true'
        working-directory: apps/android
        run: ./gradlew :app:bundleRelease

      - name: Build signed release APK and bundle
        if: steps.keys.outputs.signing == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :app:assembleRelease :app:bundleRelease
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK and bundle
        if: steps.keys.outputs.signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
