name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Device (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      # the native modules (onoff, hci-socket) only build on the Pi
      - run: npm ci --ignore-scripts

      - run: npm test

  esp32:
    name: ESP32 (PlatformIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # the platform, toolchain and libraries are large: keep them between runs
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}

      # the pioarduino platform in platformio.ini needs PlatformIO Core 6.1.19 or newer
      - run: pip install platformio==6.1.19

      - name: Host tests (protocol, config, scheduler, cameras)
        working-directory: esp32
        run: pio test -e native

      - name: Build the firmware (ESP32-S3)
        working-directory: esp32
        run: pio run -e device

      - name: Build the firmware (ESP32-C3)
        working-directory: esp32
        run: pio run -e device-c3

  ios:
    name: iOS (Swift)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # the project file format needs Xcode 16 or newer
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test KairosKit
        working-directory: ios/KairosKit
        run: swift test

      - name: Build the app
        working-directory: ios
        run: |
          xcodebuild build \
            -project Kairos.xcodeproj \
            -scheme Kairos \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
