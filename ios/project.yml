# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: CameraTrigger
options:
  bundleIdPrefix: com.noahprail
  deploymentTarget:
    iOS: "17.0"
packages:
  CameraTriggerKit:
    path: CameraTriggerKit
targets:
  CameraTrigger:
    type: application
    platform: iOS
    sources:
      - CameraTrigger
    dependencies:
      - package: CameraTriggerKit
    info:
      path: CameraTrigger/Info.plist
      properties:
        CFBundleDisplayName: Camera Trigger
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Camera Trigger uses Bluetooth to configure and control your scheduled camera trigger devices.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahprail.camtrigger
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  CameraTrigger:
    build:
      targets:
        CameraTrigger: all
    run:
      config: Debug
